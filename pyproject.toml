[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-notes-mcp"
version = "0.1.0"
description = "MCP server for Apple Notes with resolved internal [[links]]"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ben Ralston" }
]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.30.0",
    "bbpb>=1.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-quartz>=12.1",
    "fastembed>=0.5",
    "pyobjc-framework-eventkit>=12.1",
]

[project.scripts]
apple-notes-mcp = "apple_notes_mcp.server:main"
apple-notes-mcp-remote = "apple_notes_mcp.remote.cli:main"
notes-graph-ui-helper = "apple_notes.ui_helper_daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_notes", "src/apple_notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "macos_gui: needs a live macOS GUI session with Apple Notes + TCC grants (CI excludes via -m 'not macos_gui')",
    "embedding_model: downloads/loads the real fastembed ONNX model (CI excludes; run locally)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
